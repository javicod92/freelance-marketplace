services:
  postgres:
    image: postgres:latest
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - freelance-network

  users-service:
    container_name: users-service
    build:
      context: ./backend/users-service
    depends_on:
      - postgres
    ports:
      - "3001:3001"
    working_dir: /app
    command: pnpm dev
    env_file:
      - ./backend/users-service/.env
    networks:
      - freelance-network
    volumes:
      - ./backend/users-service/src:/app/src
      - ./backend/users-service/.env:/app/.env
      - ./backend/users-service/package.json:/app/package.json

volumes:
  postgres-data:

networks:
  freelance-network:
    driver: bridge
