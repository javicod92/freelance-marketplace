services:
  users-db: # Nombre del servicio, usado en la base de datos (comunicacion)
    image: postgres:latest
    container_name: user-db # Nombre del contenedor
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - freelance-network

  listings-db: # Nombre del servicio, usado en la base de datos (comunicacion)
    image: postgres:latest
    container_name: listing-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_LISTING}
    ports:
      - "5434:5432" # expuesta en 5434 para que no choque con users-db
    volumes:
      - listings-db-data:/var/lib/postgresql/data
    networks:
      - freelance-network

  users-service:
    container_name: users-service
    build:
      context: ./backend/users-service
    depends_on:
      - users-db
    ports:
      - "3001:3001"
      - "5555:5555"
    working_dir: /app
    command: pnpm dev
    env_file:
      - ./backend/users-service/.env
    networks:
      - freelance-network
    volumes:
      - ./backend/users-service/src:/app/src
      - ./backend/users-service/.env:/app/.env
      - ./backend/users-service/package.json:/app/package.json

  listings-service:
    container_name: listings-service
    build:
      context: ./backend/listings-service
    depends_on:
      - listings-db
    ports:
      - "4002:4002"
    working_dir: /app
    command: pnpm dev
    networks:
      - freelance-network
    volumes:
      - ./backend/listings-service/src:/app/src
      - ./backend/listings-service/prisma:/app/prisma
      - ./backend/listings-service/package.json:/app/package.json

  api-gateway:
    container_name: api-gateway
    build:
      context: ./backend/api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - users-service
      - listings-service
    networks:
      - freelance-network
    volumes:
      - ./backend/api-gateway/src:/app/src
    env_file:
      - ./backend/api-gateway/.env

volumes:
  postgres-data:
  listings-db-data:

networks:
  freelance-network:
    driver: bridge
